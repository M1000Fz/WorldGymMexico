<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Cliente - Gym</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-warning text-dark fw-bold">
                    ✏️ Editar Cliente (ID: {{ cliente[0] }})
                </div>
                <div class="card-body">
                    <!-- El formulario envía los datos a la misma ruta por POST -->
                    <form action="/editar/{{ cliente[0] }}" method="POST" class="row g-3">
                        <div class="col-md-6">
                            <label>Nombre:</label>
                            <input type="text" name="nombre" class="form-control" value="{{ cliente[1] }}" required>
                        </div>
                        <div class="col-md-6">
                            <label>Apellido:</label>
                            <!-- cliente[2] es el apellido porque viene de la consulta SELECT en app.py -->
                            <input type="text" name="apellido" class="form-control" value="{{ cliente[2] }}" required>
                        </div>
                        <div class="col-md-6">
                            <label>Email:</label>
                            <!-- Revisa si hay nulos para que no ponga "None" en el input -->
                            <input type="email" name="email" class="form-control" value="{{ cliente[3] if cliente[3] != 'None' and cliente[3] != None else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label>Teléfono:</label>
                            <input type="text" name="telefono" class="form-control" value="{{ cliente[4] if cliente[4] != 'None' and cliente[4] != None else '' }}">
                        </div>
                        <div class="col-md-12">
                            <label>Membresía actual: <span class="badge bg-secondary">{{ cliente[5] }}</span></label>
                            <select name="membresia" class="form-select mt-2">
                                <option value="Mensual" {% if cliente[5] == 'Mensual' %}selected{% endif %}>Mensual</option>
                                <option value="Trimestral" {% if cliente[5] == 'Trimestral' %}selected{% endif %}>Trimestral</option>
                                <option value="Anual" {% if cliente[5] == 'Anual' %}selected{% endif %}>Anual</option>
                                <option value="VIP" {% if cliente[5] == 'VIP' %}selected{% endif %}>VIP</option>
                            </select>
                        </div>
                        <div class="col-12 d-flex justify-content-between mt-4">
                            <a href="/" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-warning fw-bold">Actualizar Datos</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
